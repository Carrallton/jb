version: '3.9'

services:
  db:
    image: postgres:15
    container_name: broover_db
    environment:
      POSTGRES_DB: myblog
      POSTGRES_USER: broover
      POSTGRES_PASSWORD: Yumshanov39
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - broover_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: broover_backend
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - SECRET_KEY=django-insecure-uh4us2oooi(hjf=-&5-36)ftrzt4ikv3i(0j_4&#5cjz@e4&pj
      - DEBUG=False
      - ALLOWED_HOSTS=broover.ru
    depends_on:
      - db
    networks:
      - broover_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: broover_frontend
    command: npm run start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - broover_network

  nginx:
    image: nginx:latest
    container_name: broover_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/broover/jb/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend
    networks:
      - broover_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  broover_network: